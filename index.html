<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicky</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        background: #ecd467;
        color: #111;
        padding: 15px;
      }

      .editor {
        width: 100%;
        flex: 1;
        min-height: calc(100vh - 30px);
        font-size: 0.9rem;
        line-height: 1.5;
        outline: none;
        cursor: text;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        user-select: text;
      }

      .editor:focus {
        outline: none;
      }

      .save-indicator {
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 0.75rem;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.12);
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      .save-indicator.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="editor" contenteditable="true" spellcheck="false"></div>
    <div id="save-indicator" class="save-indicator">Saved</div>
    <script>
      const editor = document.querySelector('.editor');
      const saveIndicator = document.getElementById('save-indicator');
      let saveIndicatorTimeout;

      function showSaveIndicator() {
        saveIndicator.classList.add('visible');
        clearTimeout(saveIndicatorTimeout);
        saveIndicatorTimeout = setTimeout(() => {
          saveIndicator.classList.remove('visible');
        }, 1500);
      }

      async function saveNote() {
        await window.api.saveNote(editor.innerText);
        showSaveIndicator();
      }

      window.api.onLoadNote((text) => {
        editor.innerText = text;
        editor.focus();
      });

      window.api.onSaveRequest(() => {
        saveNote();
      });

      editor.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 's') {
          event.preventDefault();
          saveNote();
        }
      });

      editor.addEventListener('paste', (event) => {
        event.preventDefault();

        const text = event.clipboardData.getData('text/plain').replace(/\r\n/g, '\n');
        const selection = window.getSelection();
        if (!selection.rangeCount) return;

        selection.deleteFromDocument();

        const range = selection.getRangeAt(0);
        const fragment = document.createDocumentFragment();
        const lines = text.split('\n');

        for (let i = 0; i < lines.length; i++) {
          if (i > 0) {
            fragment.appendChild(document.createElement('br'));
          }
          if (lines[i].length > 0) {
            fragment.appendChild(document.createTextNode(lines[i]));
          }
        }

        range.insertNode(fragment);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      });

      editor.focus();
    </script>
  </body>
</html>
